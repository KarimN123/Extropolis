services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: extropolis
      POSTGRES_PASSWORD: extropolis
      POSTGRES_DB: extropolis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extropolis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
